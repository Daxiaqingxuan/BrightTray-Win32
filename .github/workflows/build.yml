name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Supply-chain notes:
#  * every third-party action is pinned to a full 40-hex commit SHA, with the
#    corresponding major tag in a comment. Checked by tests/run_tests.py.
#  * the TinyCC archive is verified against a fixed SHA-256 before extraction.
#    Verified value is identical on both Savannah mirrors (489,586 bytes).
#  * bright.c is hashed right after checkout; .gitattributes keeps it LF so the
#    Windows checkout is byte-identical to the local file.
#  * tagged releases get a build provenance attestation from GitHub's OIDC.

permissions:
  contents: read

jobs:
  verify:
    name: verify (tests + lint)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Repository test suite
        run: python tests/run_tests.py

      - name: Source lint
        run: python tests/lint_source.py

  build:
    name: build + provenance
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify source bytes after checkout
        shell: pwsh
        run: |
          $expected = '8ff57f3d53fc79605851ac5515abeaff77d24b4e64024a7503de6b5a33de46a3'
          $actual = (Get-FileHash 'bright.c' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "bright.c mismatch: $actual (expected $expected). Check .gitattributes line endings."
          }
          Write-Host "bright.c SHA256 OK: $actual"

      - name: Download TinyCC 0.9.27 win64 and verify SHA-256
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = '34a721949a2583fdff725312da092fa0f5f1f284b702e6f811c6954714faabb2'
          # Keep the archive outside the worktree: a stray .zip in the source
          # tree trips the "no binaries" check below.
          $zip = Join-Path $env:RUNNER_TEMP 'tcc-0.9.27-win64-bin.zip'
          $mirrors = @(
            'https://fosszone.csd.auth.gr/nongnu/tinycc/tcc-0.9.27-win64-bin.zip',
            'https://download.savannah.gnu.org/releases/tinycc/tcc-0.9.27-win64-bin.zip',
            'https://ftp.cc.uoc.gr/mirrors/nongnu.org/tinycc/tcc-0.9.27-win64-bin.zip'
          )
          $ok = $false
          foreach ($url in $mirrors) {
            try {
              Invoke-WebRequest -Uri $url -OutFile $zip -TimeoutSec 120
              $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($actual -ne $expected) {
                Write-Host "REJECTED $url : unexpected SHA256 $actual"
                Remove-Item $zip -Force
                continue
              }
              Write-Host "Verified $url : $actual"
              $ok = $true
              break
            } catch {
              Write-Host "Mirror unavailable: $url"
              Remove-Item $zip -Force -ErrorAction SilentlyContinue
            }
          }
          if (-not $ok) { throw 'No mirror supplied the hash-pinned TinyCC archive' }
          Expand-Archive -Path $zip -DestinationPath tcc-dist -Force
          $tcc = Get-ChildItem -Path tcc-dist -Filter tcc.exe -Recurse | Select-Object -First 1
          if (-not $tcc) { throw 'tcc.exe not found in the verified archive' }
          "TCC_EXE=$($tcc.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install regenerated import libraries
        shell: pwsh
        run: |
          $tccLib = Join-Path (Split-Path $env:TCC_EXE) 'lib'
          if (-not (Test-Path $tccLib)) { New-Item -ItemType Directory -Path $tccLib | Out-Null }
          Copy-Item -Path "lib\*.def" -Destination $tccLib -Force
          Write-Host "Installed import definitions into $tccLib"

      - name: Build
        shell: cmd
        run: |
          if not exist build mkdir build
          "%TCC_EXE%" bright.c -o build\BrightTray.exe -lshell32 -ladvapi32 -Wl,-subsystem=windows
          if errorlevel 1 exit /b 1
          if not exist build\BrightTray.exe exit /b 1

      - name: Verify deterministic binary and publish checksum
        shell: pwsh
        run: |
          $expected = (Get-Content 'tests/expected-binary.sha256' -Raw).Trim().ToLowerInvariant()
          $actual = (Get-FileHash 'build/BrightTray.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item 'build/BrightTray.exe').Length
          if ($actual -ne $expected) {
            throw "Binary hash mismatch: $actual (expected $expected). Reproducibility regressed."
          }
          if ($size -ne 36352) { throw "Unexpected size: $size (expected 36352)" }
          "$actual  BrightTray.exe" | Set-Content -Path 'build/BrightTray.exe.sha256' -Encoding ascii
          "SHA256 : $actual" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "Size   : $size bytes" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          Write-Host "Deterministic build verified: $size bytes / $actual"

      - name: Check that no binaries are committed
        shell: pwsh
        run: |
          # Check the committed tree, not the worktree: build/ and tcc-dist/
          # legitimately contain generated binaries at this point.
          $unexpected = @(git ls-files | Where-Object { $_ -match '\.(exe|dll|a|zip|obj)$' })
          if ($unexpected) { throw "Unexpected tracked binaries: $($unexpected -join ', ')" }
          Write-Host 'Source tree is free of binary artifacts'

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: build/BrightTray.exe

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: BrightTray-win64
          path: |
            build/BrightTray.exe
            build/BrightTray.exe.sha256
          if-no-files-found: error

  release:
    name: tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: BrightTray-win64
          path: dist

      - name: Attach binary and checksum to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
